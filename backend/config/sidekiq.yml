:development:
  :url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  :concurrency: 5
  :queues:
    - [high_priority, 2]
    - [default, 3]
    - [low_priority, 1]

:test:
  :url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  :queues:
    - high_priority
    - default
    - low_priority

:production:
  :url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  :concurrency: 10
  :queues:
    - [high_priority, 3]
    - [default, 5]
    - [low_priority, 2]
